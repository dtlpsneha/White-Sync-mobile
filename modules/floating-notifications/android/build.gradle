plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.floatingnotifications'
version = '1.0.0'

android {
  namespace "expo.modules.floatingnotifications"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core:1.13.1"
  compileOnly "com.google.firebase:firebase-messaging:24.0.1"
}
